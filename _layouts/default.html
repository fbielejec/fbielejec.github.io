<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">

    <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        processEscapes: true
      }
    });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="{{ site.baseurl }}/images/favicon/site.webmanifest">
    <link rel="mask-icon" color="#c45e3e" href="{{ site.baseurl }}/images/favicon/safari-pinned-tab.svg">
    <meta name="msapplication-TileColor" content="#1a2332">
    <meta name="theme-color" content="#1a2332">
  </head>

  <body>
    <div class="top-accent"></div>

    <div class="wrapper-masthead">
      <div class="container-wide">
        <header class="masthead">
          <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
          <nav>
            <a href="{{ site.baseurl }}/">Blog</a>
            <a href="{{ site.baseurl }}/projects">Projects</a>
            <a href="{{ site.baseurl }}/publications">Publications</a>
            <a href="{{ site.baseurl }}/about">About</a>
            <a href="{{ site.baseurl }}/cv">CV</a>
          </nav>
        </header>
      </div>
    </div>

    <div class="site-layout container-wide">
      <aside class="sidebar">
        {% include sidebar.html %}
      </aside>
      <main id="main" role="main" class="site-content">
        {{ content }}
      </main>
    </div>

    <div class="wrapper-footer">
      <div class="container-wide">
        <footer class="footer">
          <div class="footer-copy">
            &copy; {{ site.time | date: '%Y' }} {{ site.name }}
          </div>
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
